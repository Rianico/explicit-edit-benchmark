---
# yamllint disable rule:line-length
name: Release official workflow

"on":
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-official-workflow
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: official-release
    env:
      GH_TOKEN: ${{ secrets.OFFICIAL_RELEASE_TOKEN }}
      OFFICIAL_RELEASE_AUTOMATION: "1"
    steps:
      - name: Require maintainer release credential
        run: test -n "$GH_TOKEN"

      - name: Checkout benchmark
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          token: ${{ secrets.OFFICIAL_RELEASE_TOKEN }}
          path: benchmark

      - name: Checkout caller template
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: alexshpunt/explicit-edit-benchmark-run-template
          token: ${{ secrets.OFFICIAL_RELEASE_TOKEN }}
          path: template

      - name: Checkout production caller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: alexshpunt/explicit-edit-benchmark-run
          token: ${{ secrets.OFFICIAL_RELEASE_TOKEN }}
          path: caller

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: benchmark/package-lock.json

      - name: Install release dependencies
        working-directory: benchmark
        run: npm ci

      - name: Create release branches
        env:
          RELEASE_BRANCH: release/official-${{ github.run_id }}
        run: |
          git config --global user.name github-actions[bot]
          git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C benchmark switch -c "$RELEASE_BRANCH"
          git -C template switch -c "$RELEASE_BRANCH"
          git -C caller switch -c "$RELEASE_BRANCH"

      - name: Compute and commit every pin
        working-directory: benchmark
        run: >-
          npm run release:official --
          --template-directory ../template
          --caller-directory ../caller

      - name: Push release branches
        env:
          RELEASE_BRANCH: release/official-${{ github.run_id }}
        run: |
          git -C benchmark push --set-upstream origin "$RELEASE_BRANCH"
          git -C template push --set-upstream origin "$RELEASE_BRANCH"
          git -C caller push --set-upstream origin "$RELEASE_BRANCH"

      - name: Open coordinated pull requests
        env:
          RELEASE_BRANCH: release/official-${{ github.run_id }}
        run: |
          gh pr create --repo alexshpunt/explicit-edit-benchmark --base main --head "$RELEASE_BRANCH" --title "Approve official workflow release" --body "Generated by maintainer release run $GITHUB_RUN_ID."
          gh pr create --repo alexshpunt/explicit-edit-benchmark-run-template --base main --head "$RELEASE_BRANCH" --title "Pin official workflow release" --body "Generated by maintainer release run $GITHUB_RUN_ID. Merge after the benchmark policy PR."
          gh pr create --repo alexshpunt/explicit-edit-benchmark-run --base main --head "$RELEASE_BRANCH" --title "Pin official workflow release" --body "Generated by maintainer release run $GITHUB_RUN_ID. Merge after the benchmark policy PR."
