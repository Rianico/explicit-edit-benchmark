---
name: Official benchmark run

"on":
  workflow_call:
    inputs:
      model:
        description: Exact Pi model id
        required: true
        type: string
      thinking:
        description: Pi reasoning level
        required: true
        type: string
      task:
        description: One registered benchmark task for the first live smoke
        required: false
        default: replace-all-10-plain
        type: string
      pi_version:
        description: Exact published Pi Coding Agent version
        required: true
        type: string
    secrets:
      pi_auth_json:
        description: Pi auth.json used only by the measured process
        required: true

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  produce-and-attest:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout pinned benchmark
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: alexshpunt/explicit-edit-benchmark
          ref: 91d20ec1871e513f0b28570cfb2e4f0e09858d56
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned benchmark and runtime
        env:
          PI_VERSION: ${{ inputs.pi_version }}
        run: |
          set -euo pipefail
          npm ci
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          runtime="$RUNNER_TEMP/pi-runtime"
          npm install --prefix "$runtime" \
            "@earendil-works/pi-coding-agent@$PI_VERSION"
          echo "$runtime/node_modules/.bin" >> "$GITHUB_PATH"
          echo "PI_RUNTIME=$runtime" >> "$GITHUB_ENV"

      - name: Write private model credentials
        env:
          PI_AUTH_JSON: ${{ secrets.pi_auth_json }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$PI_AUTH_JSON" > "$RUNNER_TEMP/pi-auth.json"
          python3 -m json.tool "$RUNNER_TEMP/pi-auth.json" >/dev/null

      - name: Run one registered task and export normalized evidence
        env:
          MODEL: ${{ inputs.model }}
          THINKING: ${{ inputs.thinking }}
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/benchmark-config.json"
          run_id="official-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node scripts/prepare-benchmark.mjs \
            --harness pi-default \
            --model "$MODEL" \
            --thinking "$THINKING" \
            --command "$PI_RUNTIME/node_modules/.bin/pi" \
            --auth-file "$RUNNER_TEMP/pi-auth.json" \
            --runtime "$PI_RUNTIME" \
            --output "$config"
          npm run benchmark -- check --config "$config"
          npm run benchmark -- run \
            --config "$config" \
            --smoke \
            --task "$TASK" \
            --concurrency 1 \
            --timeout-seconds 180 \
            --run-id "$run_id"
          npm run benchmark -- export "results/$run_id"
          npm run benchmark -- inspect "results/$run_id/normalized"
          RUN_DIRECTORY="results/$run_id" node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import path from "node:path";

          const root = process.env.RUN_DIRECTORY;
          const content = await readFile(
            path.join(root, "normalized", "rounds.jsonl"),
            "utf8",
          );
          const rows = content
            .trim()
            .split("\n")
            .filter(Boolean)
            .map(JSON.parse);
          const technical = rows.find(
            (row) => row.timedOut || row.exitCode !== 0,
          );
          if (technical) {
            const stderr = await readFile(
              path.join(
                root,
                "trials",
                technical.trialId,
                "agent",
                "stderr.log",
              ),
              "utf8",
            ).catch(() => "");
            const reason = stderr
              .split("\n")
              .map((line) => line.trim())
              .find(Boolean)
              ?.replace(/[A-Za-z0-9_.-]{24,}/g, "…");
            const detail = reason ? `: ${reason}` : "";
            throw new Error(
              `Technical smoke failure: exit=${technical.exitCode}${detail}`,
            );
          }
          NODE

          artifact="$RUNNER_TEMP/official-result.tar.gz"
          node -e '
            const fs = require("node:fs");
            const manifest = {
              schemaVersion: 1,
              verification: "verified",
              source: "github-actions",
              repository: process.env.GITHUB_REPOSITORY,
              runId: process.env.GITHUB_RUN_ID,
              runAttempt: process.env.GITHUB_RUN_ATTEMPT,
              workflowRef: process.env.GITHUB_WORKFLOW_REF,
              runnerSha: process.argv[1],
              task: process.env.TASK,
            };
            fs.writeFileSync(
              process.argv[2],
              JSON.stringify(manifest, null, 2) + "\n",
            );
          ' "91d20ec1871e513f0b28570cfb2e4f0e09858d56" \
            "results/$run_id/official-manifest.json"
          tar --create --gzip --file "$artifact" \
            -C "results/$run_id" official-manifest.json normalized
          sha256sum "$artifact" | tee "$RUNNER_TEMP/official-result.sha256"
          echo "ARTIFACT=$artifact" >> "$GITHUB_ENV"

      - name: Attest exact result archive
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ env.ARTIFACT }}

      - name: Collect public proof
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE_PATH" "$RUNNER_TEMP/attestation.jsonl"

      - name: Upload result and proof
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ runner.temp }}/official-result.sha256
            ${{ runner.temp }}/attestation.jsonl
          if-no-files-found: error
          retention-days: 14

      - name: Remove credentials
        if: always()
        run: rm --force "$RUNNER_TEMP/pi-auth.json"
